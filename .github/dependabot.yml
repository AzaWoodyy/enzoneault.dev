# Weekly version updates. No GitHub Actions workflow in this repo, so only the
# bun ecosystem is tracked; Vercel builds each PR as a preview.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Minors and patches in one PR; each major gets its own.
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The runtime is Node 26 (engines, .nvmrc, Vercel): its types follow it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
